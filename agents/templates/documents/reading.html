<!doctype html>
<html lang="$if(lang)$$lang$$else$en$endif$">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>$title$</title>
  <style>
    :root {
      color-scheme: light dark;
      --paper: #fff;
      --ink: #202a33;
      --muted: #566573;
      --line: #d5dee6;
      --wash: #f3f6f8;
      --link: #155783;
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; scroll-behavior: smooth; scroll-padding-top: 1.5rem; }
    body { max-width: 94rem; margin: 0 auto; padding: 3rem 2.6rem 6rem; background: var(--paper); color: var(--ink); font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    a { color: var(--link); text-underline-offset: 0.18em; overflow-wrap: anywhere; }
    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible, summary:focus-visible, .table-wrap:focus-visible { outline: 3px solid var(--link); outline-offset: 4px; }
    .skip-link { position: fixed; top: 0.75rem; left: 0.75rem; z-index: 10; padding: 0.6rem 0.8rem; background: var(--ink); color: var(--paper); transform: translateY(-200%); }
    .skip-link:focus { transform: translateY(0); }
    .page { display: grid; grid-template-columns: minmax(0, 1fr) 15rem; gap: clamp(3rem, 6vw, 6rem); }
    main { min-width: 0; }
    .document-head { max-width: 52rem; margin-bottom: 2.8rem; }
    h1 { margin: 0; font-size: clamp(2.2rem, 4vw, 3.5rem); font-weight: 700; line-height: 1.1; letter-spacing: -0.025em; text-wrap: balance; }
    .subtitle { margin: 1rem 0 0; color: var(--muted); font-size: 1.15rem; }
    .document-meta { display: flex; flex-wrap: wrap; gap: 0.4rem 1.2rem; margin-top: 1.4rem; padding-top: 0.8rem; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.78rem; }
    article > h2, article > p, article > ul, article > ol, article > blockquote, article > pre, article > details, article section > :not(.table-wrap, figure) { max-width: 52rem; }
    article > section, article > .table-wrap, article > figure, article section > .table-wrap, article section > figure { max-width: none; }
    h2 { margin: 3.5rem 0 1rem; padding-top: 1.3rem; border-top: 1px solid var(--line); font-size: 1.7rem; line-height: 1.3; letter-spacing: -0.012em; }
    h3 { margin: 2rem 0 0.7rem; font-size: 1.25rem; line-height: 1.4; }
    p, ul, ol { max-width: 78ch; }
    p { margin: 0 0 1rem; }
    li { margin-bottom: 0.4rem; }
    strong { font-weight: 680; }
    blockquote { margin: 1.5rem 0; padding: 0.9rem 1.2rem; border-left: 3px solid var(--line); background: var(--wash); }
    blockquote > :last-child { margin-bottom: 0; }
    pre { overflow-x: auto; padding: 1rem; border-left: 3px solid var(--line); background: var(--wash); font-size: 0.85rem; }
    code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 0.9em; }
    :not(pre) > code { padding: 0.1em 0.25em; border-radius: 3px; background: var(--wash); }
    .table-wrap { margin: 1.4rem 0 1.8rem; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; line-height: 1.5; }
    caption { margin-bottom: 0.6rem; text-align: left; font-weight: 650; }
    th, td { min-width: 8rem; padding: 0.7rem 0.8rem; border-bottom: 1px solid var(--line); vertical-align: top; text-align: left; }
    th { border-top: 1px solid var(--line); background: var(--wash); font-weight: 650; }
    figure { margin: 1.8rem 0; }
    figure img, figure svg { display: block; max-width: 100%; height: auto; }
    figcaption { margin-top: 0.7rem; color: var(--muted); font-size: 0.88rem; }
    details { padding: 1rem 0; border-top: 1px solid var(--line); }
    details:last-of-type { border-bottom: 1px solid var(--line); }
    summary { cursor: pointer; font-weight: 650; }
    details[open] > summary { margin-bottom: 0.8rem; }
    .toc { position: sticky; top: 2.5rem; align-self: start; max-height: calc(100vh - 5rem); overflow: auto; font-size: 0.82rem; line-height: 1.45; }
    .toc h2 { margin: 0 0 0.7rem; padding: 0; border: 0; color: var(--muted); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; }
    #TOC ul { margin: 0; padding: 0; list-style: none; }
    #TOC li { margin: 0 0 0.65rem; }
    #TOC ul ul { display: none; }
    #TOC a { color: var(--muted); text-decoration: none; }
    #TOC a:hover { color: var(--link); text-decoration: underline; }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #151b21; --ink: #e3eaf0; --muted: #b0bdc8; --line: #394651; --wash: #202a33; --link: #92cef4; }
    }
    @media (max-width: 900px) {
      body { padding: 2rem 1.4rem 4rem; }
      .page { display: block; }
      .toc { position: static; max-height: none; margin-bottom: 2.5rem; padding: 1rem 0; border-block: 1px solid var(--line); }
      #TOC ul { columns: 2; column-gap: 2rem; }
      #TOC li { break-inside: avoid; }
    }
    @media (max-width: 560px) {
      body { padding-inline: 1rem; font-size: 16px; }
      #TOC ul { columns: 1; }
      th, td { min-width: 9rem; padding: 0.6rem; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    @media print {
      :root { --paper: #fff; --ink: #111; --muted: #444; --line: #bbb; --wash: #f3f3f3; --link: #111; }
      body { max-width: none; padding: 0; font-size: 10.5pt; }
      .page { display: block; }
      .toc, .skip-link { display: none; }
      h1 { font-size: 26pt; }
      h2 { margin-top: 1.8rem; font-size: 18pt; }
      h3 { font-size: 13pt; }
      h1, h2, h3, summary { break-after: avoid; }
      tr, figure { break-inside: avoid; }
      .table-wrap { overflow: visible; }
      table { font-size: 9pt; }
      a { color: inherit; text-decoration: none; }
      @page { margin: 18mm; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#document">Skip to document</a>
  <div class="page">
    <main id="document">
      <header class="document-head">
        <h1>$title$</h1>
        $if(subtitle)$<p class="subtitle">$subtitle$</p>$endif$
        $if(updated)$<div class="document-meta"><span>Updated $updated$</span>$if(audience)$<span>For $audience$</span>$endif$</div>$else$$if(audience)$<div class="document-meta"><span>For $audience$</span></div>$endif$$endif$
      </header>
      <article>$body$</article>
    </main>
    $if(toc)$<aside class="toc"><h2>Contents</h2><nav id="TOC" aria-label="Document contents">$toc$</nav></aside>$endif$
  </div>
  <script>
    (() => {
      const details = [...document.querySelectorAll('details')];
      let printState = [];
      addEventListener('beforeprint', () => {
        printState = details.map((element) => element.open);
        details.forEach((element) => { element.open = true; });
      });
      addEventListener('afterprint', () => {
        details.forEach((element, index) => { element.open = printState[index]; });
        printState = [];
      });
    })();
  </script>
</body>
</html>
