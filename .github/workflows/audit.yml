name: Dependency Audit

# Audit dependency changes before merge and rescan monthly because
# vulnerabilities can appear after a lockfile lands.
on:
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/audit.yml
  schedule:
    - cron: "41 9 3 * *" # monthly, morning UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: pip-audit over locked dependencies
        run: just audit
