name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - uses: pandoc/actions/setup@6a25d32c172975d0c82425964800b60988e93279 # v1.1.1
        with:
          version: "3.10"
      - name: Install Pi so typecheck-pi runs instead of skipping
        # Pinned so CI is deterministic; bump alongside the host install.
        run: bun install -g @earendil-works/pi-coding-agent@0.84.4
      - name: Deterministic quality gate
        run: just check
