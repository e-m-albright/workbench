name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install locked development tools
        run: pnpm install --frozen-lockfile
      - uses: pandoc/actions/setup@dad02246c528d7888992b063050d14b77ae423b0 # v1.1.1
        with:
          version: "3.10"
      - name: Install launcher test shell
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh
      - name: Install Pi so typecheck-pi runs instead of skipping
        # Pinned so CI is deterministic; bump alongside the host install.
        run: npm install -g @earendil-works/pi-coding-agent@0.86.1
      - name: Deterministic quality gate
        run: just check

  native-canary:
    name: macOS restricted-agent boundary
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - name: Install pinned vendor CLIs
        # Keep optional platform binaries inside each admitted package directory.
        run: >-
          npm install -g --install-strategy=nested
          @anthropic-ai/claude-code@2.1.278
          @openai/codex@0.155.1
          @earendil-works/pi-coding-agent@0.86.1
      - name: Probe the real boundary with synthetic data and credentials
        # No model prompts or provider credentials are used by these tests.
        run: |
          canary_home="$(mktemp -d /private/tmp/workbench-canary.XXXXXX)"
          trap 'rm -rf "$canary_home"' EXIT
          export WORKBENCH_NATIVE_CANARY_HOME="$canary_home"
          uv run --locked python -c 'import os; from pathlib import Path; from workbench.native import prepare; prepare(Path(os.environ["WORKBENCH_NATIVE_CANARY_HOME"]))'
          uv run --locked pytest tests/test_native_canary.py -q

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Audit every locked dependency surface
        run: just audit

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — the whole point of this scan

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
